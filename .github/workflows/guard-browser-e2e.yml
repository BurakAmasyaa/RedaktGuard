name: Guard browser E2E

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-chromium:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --no-assets
      - name: Chrome for Testing kur
        if: matrix.browser == 'chrome'
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          $download = $manifest.channels.Stable.downloads.chrome | Where-Object { $_.platform -eq 'win64' } | Select-Object -First 1
          if (-not $download) { throw 'Chrome for Testing win64 paketi bulunamadı.' }
          $archive = Join-Path $env:RUNNER_TEMP 'chrome-for-testing.zip'
          $install = Join-Path $env:RUNNER_TEMP 'chrome-for-testing'
          Invoke-WebRequest $download.url -OutFile $archive
          Expand-Archive $archive -DestinationPath $install
          $binary = Get-ChildItem $install -Filter chrome.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'Chrome for Testing çalıştırılabilir dosyası bulunamadı.' }
          "GUARD_E2E_CHROME_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: ${{ matrix.browser }} sentetik site E2E
        run: npm run test:e2e -- --browser=${{ matrix.browser }} --headless
